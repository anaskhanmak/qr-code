name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopmark
          POSTGRES_PASSWORD: loopmark
          POSTGRES_DB: loopmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopmark -d loopmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://loopmark:loopmark@localhost:5432/loopmark?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      SCAN_HASH_SECRET: ci-only-scan-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema=packages/db/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
      - run: npm run lint --workspace @loopmark/web
      - run: npm run typecheck --workspace @loopmark/web
      - run: npm test --workspace @loopmark/web -- --run
      - run: npm run build --workspace @loopmark/web
      - run: npm run redirect:typecheck
      - run: npm run redirect:test
